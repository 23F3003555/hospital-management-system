{% extends 'base.html' %}

{% block content %}
<h1> Doctor List tables</h1>

<table>
    <tr>
        <th>Name</th>
        <th>Qualification</th>
        <th>Specialization</th>
        <th>Experience</th>
        <th>Phone</th>
    </tr>

    </a>
    {% for doctor in doctors %}
    <tr>

        <td>{{ doctor.Name }}</td>
        <td>{{ doctor.Qualification }}</td>
        <td>{{ doctor.Specialization }}</td>
        <td>{{ doctor.Experience }}</td>
        <td>{{ doctor.Phone_number }}</td>

        <td>

            <a href="{% url 'edit_doctor' doctor.id %}">
                <button>Edit</button>
            </a>

            <a href="{%url 'delete_doctor' doctor.id %}"
                onclick="return confirm ('Are you sure delete doctor from list ?')" ;>
                <button>Delete</button>
            </a>

        </td>

    </tr>

    {% endfor %}
</table>

{% endblock %}
